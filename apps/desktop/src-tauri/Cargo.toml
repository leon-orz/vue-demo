[package]
name = "toogl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toogl（图格）桌面客户端"

[lib]
name = "toogl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# mihomo sidecar 拉起/回收（S1-3）；拉起逻辑全在 Rust 侧，前端不用 shell 插件 API
tauri-plugin-shell = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toogl-core = { path = "../../../crates/core" }
# sidecar 就绪轮询的 sleep（tauri::async_runtime 无 sleep 再导出）；
# sync：ProxyCommandState 惰性启动自检的 OnceCell 语义
tokio = { version = "1", features = ["time", "sync"] }
# 订阅定时更新（M5-07）：last_updated 的 RFC3339 生成与超期判断（与 core 同款 feature 集）
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 节点导入（M5-07）：手动/订阅节点列表的 YAML Mapping 与 KV JSON 互转（与 core 同版本）
serde_yaml = "0.9"

[dev-dependencies]
# sidecar.rs 单测：临时目录（配置生成）+ tokio 测试运行时（降级态探测）
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# subscription 命令单测：mock 订阅服务器与 mihomo controller
wiremock = "0.6"
