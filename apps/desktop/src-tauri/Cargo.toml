[package]
name = "toogl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toogl（图格）桌面客户端"

[lib]
name = "toogl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# mihomo sidecar 拉起/回收（S1-3）；拉起逻辑全在 Rust 侧，前端不用 shell 插件 API
tauri-plugin-shell = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toogl-core = { path = "../../../crates/core" }
# sidecar 就绪轮询的 sleep（tauri::async_runtime 无 sleep 再导出）
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# sidecar.rs 单测：临时目录（配置生成）+ tokio 测试运行时（降级态探测）
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
