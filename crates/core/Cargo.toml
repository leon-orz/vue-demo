[package]
name = "toogl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toogl 工具业务核心：数据模型 / 代理管理"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "10"
# proxy_setting 的专用 current_thread runtime（SqliteProxyStateStore）
tokio = { version = "1", features = ["rt"] }
# mihomo 批量测速的并发上限（buffer_unordered 限流，0.3 已在依赖树锁定）
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# mihomo external-controller 随机 secret 生成（v4 随机 UUID，simple 形态即 32 位 hex）
uuid = { version = "1", features = ["v4"] }
# 订阅/分享链接导入（subscription 模块）：mihomo 配置 YAML 结构化读写、
serde_yaml = "0.9"
base64 = "0.22"
url = "2"

# 系统代理（sysproxy 模块）仅 Windows 编译：注册表读写 + wininet 变更通知
# （两个版本均已在依赖树锁定：winreg 经 embed-resource、windows-sys 0.59 经 winreg）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
