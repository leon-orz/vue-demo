[package]
name = "toogl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toogl 共享核心：数据模型 / 平台适配器 / 数据源 / 密钥存储 / mihomo 客户端"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "10"
# 注意：keyring 3 默认不启用任何平台后端（会静默退化为 mock 内存存储），必须显式启用。
# 桌面端仅 Windows（NF-12）→ windows-native；hub（Linux）按开发计划 1.3 走加密文件存储，不用系统钥匙串
keyring = { version = "3", features = ["windows-native"] }
