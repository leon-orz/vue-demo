[package]
name = "toogl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toogl 共享核心：数据模型 / 平台适配器 / 数据源 / 密钥存储 / mihomo 客户端"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "10"
# sync: 扫描互斥锁；rt: mihomo 批量测速的 tokio::spawn 并发
tokio = { version = "1", features = ["sync", "rt"] }
# 注意：keyring 3 默认不启用任何平台后端（会静默退化为 mock 内存存储），必须显式启用。
# 桌面端仅 Windows（NF-14）→ windows-native；hub（Linux）按开发计划 1.3 走加密文件存储，不用系统钥匙串
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
dirs = "6"

# 系统代理（sysproxy 模块）仅 Windows 编译：注册表读写 + wininet 变更通知
# （两个版本均已在依赖树锁定：winreg 经 embed-resource、windows-sys 0.59 经 winreg）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinInet"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
