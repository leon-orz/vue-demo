name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:front

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # cargo test 会触发 ts-rs 导出测试，重新生成 packages/core-types/bindings
      - run: cargo test --workspace
      # 生成结果必须与仓库一致，防止手改 bindings
      - run: git diff --exit-code -- packages/core-types/bindings

  tauri-build:
    runs-on: windows-latest
    needs: [lint, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # 前端构建由 tauri.conf.json 的 beforeBuildCommand（pnpm build）触发，不重复执行
      - run: pnpm --filter toogl-desktop tauri build
